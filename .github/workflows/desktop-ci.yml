name: Desktop CI

# Ordinary changes use representative native architectures. Release calls
# this workflow for the full test matrix before building signed packages.

on:
  pull_request:
    # Default types only: an `edited` event whose jobs all skip would replace a
    # failed run's checks on the same commit. A PR retargeted onto main gets CI
    # on its next push, or by closing and reopening it.
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - '.github/actions/**'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - '.github/actions/**'
      - '.github/workflows/desktop-ci.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/ios-testflight.yml'
      - '.github/workflows/mobile-ci.yml'

  workflow_call:
    inputs:
      full-matrix:
        description: Validate both supported architectures on every platform
        type: boolean
        default: false
      force-all:
        description: Run every component regardless of changed paths
        type: boolean
        default: false
      skip-packages:
        description: Run tests only; the Release caller builds the real packages afterwards
        type: boolean
        default: false
      probe-version:
        description: Version embedded in the Linux core shared with package and test jobs
        type: string
        default: '0.0.0'
    secrets:
      POSTHOG_API_KEY:
        description: Analytics ingestion key embedded only in release cores
        required: false
      POSTHOG_HOST:
        description: Analytics ingestion host embedded only in release cores
        required: false
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Validate both supported architectures on every platform
        type: boolean
        default: false
      force-all:
        description: Run every component regardless of changed paths
        type: boolean
        default: false
      skip-packages:
        description: Run tests only; the Release caller builds the real packages afterwards
        type: boolean
        default: false
      probe-version:
        description: Version embedded in the Linux core shared with package and test jobs
        type: string
        default: '0.0.0'

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other.
  # github.workflow is the caller name for reusable runs: keep this group
  # distinct from the caller's release lock and from ordinary CI.
  group: ci-checks-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nothing in CI writes to the repository.
permissions:
  contents: read

env:
  CI_PROBE_VERSION: ${{ inputs.probe-version || '0.0.0' }}

defaults:
  run:
    working-directory: apps/desktop

jobs:
  # Runs for every pull request, including forks: GitHub-hosted, read-only
  # and without secrets.
  open-source:
    name: Public source check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check nothing internal is in the public source
        run: bash scripts/check-open-source.sh

  # Never run untrusted fork code on repository-configured runners. This small
  # GitHub-hosted lane still gives outside contributors useful checks.
  fork-checks:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    name: Public contribution checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Check the relay core
        run: cargo check --manifest-path probe/Cargo.toml --locked

      - name: Test the release notes tooling
        run: python3 scripts/test_release_notes.py

  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Changed components
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      shell: ${{ steps.changes.outputs.shell }}
      probe: ${{ steps.changes.outputs.probe }}
      macos: ${{ steps.changes.outputs.macos }}
      macos_core: ${{ steps.changes.outputs.macos_core }}
      macos_package: ${{ steps.changes.outputs.macos_package }}
      macos-matrix: ${{ steps.matrices.outputs.macos }}
      linux-matrix: ${{ steps.matrices.outputs.linux }}
      linux-probe-matrix: ${{ steps.matrices.outputs.linux_probe }}
      windows-matrix: ${{ steps.matrices.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      linux_core: ${{ steps.changes.outputs.linux_core }}
      linux_integration: ${{ steps.changes.outputs.linux_integration }}
      linux_package: ${{ steps.changes.outputs.linux_package }}
      windows: ${{ steps.changes.outputs.windows }}
      windows_package: ${{ steps.changes.outputs.windows_package }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Fetch authenticated history during checkout, before credentials are removed.
          fetch-depth: 0

      - name: Select native architectures
        id: matrices
        env:
          FULL_MATRIX: ${{ inputs.full-matrix }}
          LINUX_RUNNER: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
          LINUX_ARM64_RUNNER: ${{ vars.CI_LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
          LINUX_2204_RUNNER: ${{ vars.CI_LINUX_2204_RUNNER || 'ubuntu-22.04' }}
          LINUX_2204_ARM64_RUNNER: ${{ vars.CI_LINUX_2204_ARM64_RUNNER || 'ubuntu-22.04-arm' }}
        run: |
          python3 - <<'PY_MATRIX'
          import json
          import os

          full = os.environ["FULL_MATRIX"] == "true"
          matrices = {
              "macos": [
                  {"runner": "macos-15", "arch": "arm64", "rust_target": "aarch64-apple-darwin"},
                  {"runner": "macos-15-intel", "arch": "x64", "rust_target": "x86_64-apple-darwin"},
              ],
              "linux": [
                  {"runner": os.environ["LINUX_2204_RUNNER"], "arch": "x64", "rust_target": "x86_64-unknown-linux-gnu"},
                  {"runner": os.environ["LINUX_2204_ARM64_RUNNER"], "arch": "arm64", "rust_target": "aarch64-unknown-linux-gnu"},
              ],
              "linux_probe": [
                  {"runner": os.environ["LINUX_RUNNER"], "arch": "x64", "rust_target": "x86_64-unknown-linux-gnu", "zig_host": "x86_64-linux", "zig_sha256": "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea"},
                  {"runner": os.environ["LINUX_ARM64_RUNNER"], "arch": "arm64", "rust_target": "aarch64-unknown-linux-gnu", "zig_host": "aarch64-linux", "zig_sha256": "041ac42323837eb5624068acd8b00cd5777dac4cf91179e8dad7a7e90dd0c556"},
              ],
              "windows": [
                  {"runner": "windows-latest", "arch": "x64", "msystem": "CLANG64"},
                  {"runner": "windows-11-arm", "arch": "arm64", "msystem": "CLANGARM64"},
              ],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, rows in matrices.items():
                  selected = rows if full else rows[:1]
                  print(f"{name}={json.dumps(selected, separators=(',', ':'))}", file=output)
          PY_MATRIX

      - name: Detect changed components
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_ALL: ${{ inputs.force-all }}
        run: |
          # Compare the event base with the tested commit (the merge commit on
          # PRs). Missing or unavailable history conservatively runs all jobs.
          if [ "$FORCE_ALL" = true ]; then
            python3 apps/desktop/scripts/ci-changes.py --all >> "$GITHUB_OUTPUT"
          elif [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            python3 apps/desktop/scripts/ci-changes.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            python3 apps/desktop/scripts/ci-changes.py --base unavailable --head unavailable >> "$GITHUB_OUTPUT"
          fi

  shellcheck:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    name: Shell scripts
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Lint the packaging scripts
        run: shellcheck scripts/*.sh linux/agent-relay.postinst

      - name: Test probe bridge validation
        run: bash scripts/test-probe-bridge.sh

      - name: Test CI change detection
        run: python3 scripts/test_ci_changes.py

      - name: Test the release notes tooling
        run: python3 scripts/test_release_notes.py

      - name: Test the Linux probe glibc floor check
        run: bash scripts/test-glibc-floor.sh

      - name: Test the Linux installer
        run: bash scripts/test-linux-install.sh

  probe:
    needs: changes
    if: needs.changes.outputs.probe == 'true'
    name: Probe
    # The native identity and filesystem-permission tests intentionally reject
    # root-owned sessions. Keep this suite on GitHub's non-root hosted runner;
    # repository-configured build runners may execute their jobs as uid 0.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Test Cargo binary target selection
        run: python3 scripts/test_cargo_target_selection.py

      - name: Cache the probe build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/probe

      - name: Set up Node for Pi compatibility tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test dependency cache pruning
        run: node --test "$GITHUB_WORKSPACE/.github/actions/windows-build-cache-prune/main.test.cjs"

      - name: Test live Pi sessions (legacy and current packages)
        run: bash scripts/test-pi-live.sh

      - name: Test the native Claude mobile bridge
        run: node --test scripts/test-claude-mobile-plugin.mjs scripts/mobile-build-inventory.test.mjs

      - name: Test the probe
        run: cargo test --manifest-path probe/Cargo.toml --locked

      # Code-quality ratchet: probe/rust-oleum.toml grandfathers existing
      # violations; a new one, or a regression past its ceiling, fails here.
      - name: Install rust-oleum
        run: cargo install rust-oleum --version 0.1.3 --locked

      - name: Check the code-quality ratchet
        working-directory: apps/desktop/probe
        run: rust-oleum --github-summary "$GITHUB_STEP_SUMMARY"

      # The Swift contract types are generated from the Rust registry; a
      # stale checked-in file fails here.
      - name: Check the generated contract
        run: |
          scripts/generate-contract.sh
          git diff --exit-code

  linux-core:
    needs: changes
    if: needs.changes.outputs.linux_core == 'true'
    name: Linux core (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux-probe-matrix) }}
    env:
      GLIBC_FLOOR: '2.34'
      ZIG_VERSION: '0.13.0'
      CARGO_ZIGBUILD_VERSION: '0.23.4'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache the Zig-built probe
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Retain the old key+job namespace after renaming the producer.
          shared-key: ci-linux-probe-zig-v1-${{ matrix.arch }}-linux-probe-glibc
          workspaces: apps/desktop/probe

      - name: Install zig and cargo-zigbuild
        env:
          ZIG_HOST: ${{ matrix.zig_host }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          set -euo pipefail
          archive="zig-linux-${ZIG_HOST%-linux}-$ZIG_VERSION.tar.xz"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/$archive" -o "$RUNNER_TEMP/$archive"
          echo "$ZIG_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${archive%.tar.xz}" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build the probe against glibc 2.34
        env:
          # Set only when Desktop Release calls this workflow; PR and fork
          # builds embed no analytics configuration.
          AGENT_RELAY_POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          AGENT_RELAY_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          scripts/build-probe.sh \
            --target '${{ matrix.rust_target }}' \
            --version "$CI_PROBE_VERSION" \
            --glibc "$GLIBC_FLOOR" \
            --out probe-build

      - name: Check the probe's glibc floor
        run: scripts/check-glibc-floor.sh probe-build/agent-relay-probe --max "$GLIBC_FLOOR"

      - name: Record the checked core identity
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > probe-build/source-revision.txt
          printf '%s\n' "$RUST_TARGET" > probe-build/rust-target.txt

      - name: Upload the checked Linux core
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Prefix avoids the release publisher's linux-* package pattern.
          name: ci-linux-core-${{ matrix.arch }}-${{ github.sha }}
          path: apps/desktop/probe-build/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  macos-package:
    needs: changes
    if: needs.changes.outputs.macos_package == 'true' && !inputs.skip-packages
    name: macOS package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache the Swift release build
        uses: ./.github/actions/swift-cache
        with:
          arch: ${{ matrix.arch }}
          lane: package

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: probe-${{ matrix.arch }}-macos
          lane: package
          discard-profile: debug

      - name: Build the probe
        run: scripts/build-probe.sh --target '${{ matrix.rust_target }}' --version 0.0.0 --out probe-build

      # No signing secrets in CI: build-app.sh ad-hoc signs and says so.
      - name: Assemble the app bundle
        run: |
          set -euo pipefail
          scripts/build-app.sh \
            --arch '${{ matrix.arch }}' \
            --version 0.0.0 \
            --probe probe-build \
            --out dist

      - name: Set up Python for disk image tooling
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install disk image tooling
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/python" -m pip install -r scripts/dmg-requirements.txt
          echo "$RUNNER_TEMP/dmg-tools/bin" >> "$GITHUB_PATH"

      - name: Package a disk image (smoke test)
        run: |
          set -euo pipefail
          scripts/package-dmg.sh \
            --app 'dist/Agent Relay.app' \
            --out 'dist/AgentRelay-CI-${{ matrix.arch }}.dmg'

      - name: Zip the app bundle
        run: ditto -c -k --keepParent 'dist/Agent Relay.app' "AgentRelay-macOS-${{ matrix.arch }}.zip"

      - name: Upload the app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentRelay-macOS-${{ matrix.arch }}
          path: apps/desktop/AgentRelay-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7

  macos-swift-tests:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    name: macOS Swift tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Cache the Swift test build
        uses: ./.github/actions/swift-cache
        with:
          arch: ${{ matrix.arch }}
          lane: tests

      # RelayDesktopTests depends on the executable target, so this also
      # compiles the app entrypoint when unsigned packaging is not selected.
      - name: Test the Swift package
        env:
          REQUEST_RENDER_DIR: ${{ runner.temp }}/desktop-ui-fixtures
          SESSION_COLUMNS_PREVIEW: ${{ runner.temp }}/desktop-ui-fixtures
        run: |
          mkdir -p "$SESSION_COLUMNS_PREVIEW"
          swift test --package-path macos

      - name: Test the shared session overview package
        run: swift test --package-path shared/RelaySessionOverview

      - name: Upload Swift rendering fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Swift-rendering-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/desktop-ui-fixtures
          if-no-files-found: ignore
          retention-days: 1

  macos-core-tests:
    needs: changes
    if: needs.changes.outputs.macos_core == 'true'
    name: macOS core tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.macos-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: probe-${{ matrix.arch }}-macos
          lane: tests
          discard-profile: release

      - name: Test managed Muse delivery
        run: cargo test --manifest-path probe/Cargo.toml --locked --lib relay::harness::muse

      - name: Test core diagnostic logs
        run: cargo test --manifest-path probe/Cargo.toml --locked --lib relay::diagnostics

      - name: Set up Node for Pi compatibility tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test live Pi sessions (legacy and current packages)
        run: bash scripts/test-pi-live.sh

  windows-package:
    needs: changes
    if: needs.changes.outputs.windows_package == 'true' && !inputs.skip-packages
    name: Windows package (${{ matrix.arch }})
    # The Linux GTK app, built natively with MSYS2's clang toolchain and GTK 4
    # for each architecture. Windows runners have a desktop session, so the
    # GTK harness runs without a virtual display.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    defaults:
      run:
        shell: msys2 {0}
        working-directory: apps/desktop
    env:
      # A short cargo home: RelayHistory's fixtures hold paths close to
      # Windows' 260-character limit, which a cargo home inside the
      # workspace pushed over it when cargo checked the dependency out.
      CARGO_HOME: C:\ch
      # Git itself fetches the git dependencies, honouring core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: always
      # These caches omit incremental state; do not spend time producing it.
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      # Scripts and fixtures keep their LF line endings, and long paths
      # check out.
      - name: Keep line endings and allow long paths
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          msystem: ${{ matrix.msystem }}

      - name: Cache the Cargo release dependencies
        id: build-cache
        uses: ./.github/actions/windows-build-cache
        with:
          arch: ${{ matrix.arch }}
          profile: release
          toolchain: ${{ steps.toolchain.outputs.identity }}

      # The Setup .exe is compiled with Inno Setup 6. windows-latest carries
      # it; windows-11-arm may not, so it is installed there.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            if (Get-Command choco -ErrorAction SilentlyContinue) {
              choco install innosetup --no-progress -y
            } else {
              winget install --id JRSoftware.InnoSetup -e --scope machine --silent --accept-source-agreements --accept-package-agreements --disable-interactivity
            }
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-Item $iscc | Format-List FullName, VersionInfo

      # Builds the release core and app (icon and version embedded) and
      # packages them with the GTK runtime, as zips and the Setup .exe.
      - name: Build the Windows package
        run: scripts/build-windows.sh --version 0.0.0 --arch '${{ matrix.arch }}' --out out --installer

      - name: Check the core's bridge commands
        run: bash scripts/check-probe-bridge.sh probe/target/release/agent-relay-probe.exe

      # The packaged core runs with only the DLLs the zip carries.
      - name: Smoke test the packaged core
        run: |
          unzip -l 'out/AgentRelay-0.0.0-Windows-${{ matrix.arch }}.zip' | tail -n 1
          unpacked="$(cygpath -u "$RUNNER_TEMP")/unpacked"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          unzip -q 'out/AgentRelay-0.0.0-Windows-${{ matrix.arch }}.zip' -d "$unpacked"
          PATH=/c/Windows/System32 "$unpacked/AgentRelay-Windows-${{ matrix.arch }}/bin/agent-relay-probe.exe" --version

      # Setup installs per user where the updater expects the tree, and its
      # uninstaller removes the install, the shortcut and the entry.
      - name: Install and uninstall with Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = "out\AgentRelay-0.0.0-Windows-${{ matrix.arch }}-Setup.exe"
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $root = "$env:LOCALAPPDATA\Programs\AgentRelay"
          $shortcut = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Agent Relay.lnk"
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C5377993-AE99-466F-A519-676A299A6C6D}_is1'
          foreach ($path in "$root\0.0.0\AgentRelay-Windows-${{ matrix.arch }}\bin\agent-relay-desktop.exe", "$root\unins000.exe", $shortcut, $entry) {
            if (-not (Test-Path $path)) { throw "Setup did not create $path" }
          }
          Get-ItemProperty $entry | Format-List DisplayName, DisplayVersion, InstallLocation
          Start-Process "$root\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller finishes removing its own folder just after it exits.
          for ($i = 0; $i -lt 30 -and (Test-Path $root); $i++) { Start-Sleep -Seconds 1 }
          foreach ($path in $root, $shortcut, $entry, 'HKCU:\Software\Classes\agentrelay') {
            if (Test-Path $path) { throw "The uninstaller left $path" }
          }

      - name: Upload the Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentRelay-Windows-${{ matrix.arch }}
          path: |
            apps/desktop/out/*.zip
            apps/desktop/out/*.zip.sha256
            apps/desktop/out/*-Setup.exe
            apps/desktop/out/*-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Keep only reusable release dependencies in the cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-build-cache-prune
        with:
          profile: release

  windows-tests:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: Windows tests (${{ matrix.arch }})
    # The Linux GTK app, built natively with MSYS2's clang toolchain and GTK 4
    # for each architecture. Windows runners have a desktop session, so the
    # GTK harness runs without a virtual display.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.windows-matrix) }}
    defaults:
      run:
        shell: msys2 {0}
        working-directory: apps/desktop
    env:
      # A short cargo home: RelayHistory's fixtures hold paths close to
      # Windows' 260-character limit, which a cargo home inside the
      # workspace pushed over it when cargo checked the dependency out.
      CARGO_HOME: C:\ch
      # Git itself fetches the git dependencies, honouring core.longpaths.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_TERM_COLOR: always
      # These caches omit incremental state; do not spend time producing it.
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
      # Keep runtime checks while avoiding debug-symbol generation/linking and
      # large symbol archives in CI. Local developer profiles are unchanged.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      # Scripts and fixtures keep their LF line endings, and long paths
      # check out.
      - name: Keep line endings and allow long paths
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the Windows toolchain
        id: toolchain
        uses: ./.github/actions/windows-toolchain
        with:
          msystem: ${{ matrix.msystem }}

      - name: Cache the Cargo test dependencies
        id: build-cache
        uses: ./.github/actions/windows-build-cache
        with:
          arch: ${{ matrix.arch }}
          profile: debug
          toolchain: ${{ steps.toolchain.outputs.identity }}

      - name: Test the platform file helpers
        run: 'cargo test --manifest-path probe/Cargo.toml --locked --no-default-features --features gtk --lib platform::'

      - name: Test the app's wording and state
        run: cargo test --manifest-path probe/Cargo.toml --locked --no-default-features --features gtk --lib linux_app

      - name: Test the app's window
        run: cargo test --manifest-path probe/Cargo.toml --locked --no-default-features --features gtk --test linux_app_gtk

      - name: Test the app's hosting of the core
        run: cargo test --manifest-path probe/Cargo.toml --locked --no-default-features --features gtk --test linux_app_hosting

      # Packaging already compiles and links the entrypoint when selected.
      # Otherwise keep all Windows entrypoints checked, without
      # making integration tests link production binaries they never execute.
      - name: Check the Windows entrypoints
        if: needs.changes.outputs.windows_package != 'true' || inputs.skip-packages
        run: cargo check --manifest-path probe/Cargo.toml --locked --features gtk --bins

      - name: Keep only reusable test dependencies in the cache
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/windows-build-cache-prune
        with:
          profile: debug

  linux-package:
    needs: [changes, linux-core]
    if: needs.changes.outputs.linux_package == 'true' && !inputs.skip-packages
    name: Linux package (${{ matrix.arch }})
    # Ubuntu 22.04 ships GTK 4.6, the oldest the app runs on: the app is
    # built and tested against it, natively for each architecture.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux-matrix) }}
    env:
      GLIBC_FLOOR: '2.34'
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install GTK 4 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev librsvg2-common pkg-config xvfb

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: linux-gtk4-${{ matrix.arch }}-linux
          lane: package
          discard-profile: debug

      - name: Download the checked Linux core
        uses: ./.github/actions/linux-core-artifact
        with:
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rust_target }}
          probe-version: ${{ env.CI_PROBE_VERSION }}

      - name: Build the app
        env:
          AGENT_RELAY_PROBE_VERSION: ${{ env.CI_PROBE_VERSION }}
        run: cargo build --manifest-path probe/Cargo.toml --locked --release --features gtk --bin agent-relay-desktop

      - name: Check the app's glibc floor
        run: scripts/check-glibc-floor.sh probe/target/release/agent-relay-desktop --max "$GLIBC_FLOOR"

      - name: Build Linux packages
        run: |
          scripts/build-linux.sh --version "$CI_PROBE_VERSION" --arch '${{ matrix.arch }}' \
            --app probe/target/release/agent-relay-desktop --probe probe-build/agent-relay-probe --out out

      - name: Upload Linux packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentRelay-Linux-${{ matrix.arch }}
          path: |
            apps/desktop/out/*.tar.gz
            apps/desktop/out/*.tar.gz.sha256
            apps/desktop/out/*.deb
            apps/desktop/out/*.deb.sha256
          if-no-files-found: error
          retention-days: 7
  linux-tests:
    needs: [changes, linux-core]
    # Unlike the default needs-success rule, allow a deliberately skipped core
    # for harness-only changes. Never run after a failed selector/core build.
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      (needs.changes.outputs.linux == 'true' || needs.changes.outputs.linux_integration == 'true') &&
      (
        (needs.changes.outputs.linux_core == 'true' && needs.linux-core.result == 'success') ||
        (needs.changes.outputs.linux_core == 'false' && needs.linux-core.result == 'skipped' && needs.changes.outputs.linux_integration == 'false')
      )
    name: Linux tests (${{ matrix.arch }})
    # Ubuntu 22.04 ships GTK 4.6, the oldest the app runs on: the app is
    # tested against it. Selected GTK and integration checks share one build.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux-matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install GTK 4 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libgtk-4-dev librsvg2-common pkg-config xvfb

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache the probe build
        uses: ./.github/actions/rust-lane-cache
        with:
          legacy-key: linux-gtk4-${{ matrix.arch }}-linux
          lane: tests
          discard-profile: release

      - name: Download the checked Linux core
        if: needs.changes.outputs.linux_integration == 'true'
        uses: ./.github/actions/linux-core-artifact
        with:
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rust_target }}
          probe-version: ${{ env.CI_PROBE_VERSION }}

      # Integration-selected runs use the same default-feature GTK graph for
      # all test targets. Harness-only runs opt out of unused production bins.
      - name: Test the app's wording and state
        if: needs.changes.outputs.linux == 'true'
        run: cargo test --manifest-path probe/Cargo.toml --locked ${{ needs.changes.outputs.linux_integration != 'true' && '--no-default-features' || '' }} --features gtk --lib linux_app

      - name: Test the app's window
        if: needs.changes.outputs.linux == 'true'
        run: xvfb-run -a cargo test --manifest-path probe/Cargo.toml --locked ${{ needs.changes.outputs.linux_integration != 'true' && '--no-default-features' || '' }} --features gtk --test linux_app_gtk

      # The real core binary, driven by the app's bridge client against fake
      # Relaycast and Cloud in an empty home.
      # Cargo builds enabled binaries for this integration target, including
      # the app and fake core that the following startup smoke check executes.
      - name: Test the app against the real core
        if: needs.changes.outputs.linux_integration == 'true'
        env:
          RELAY_E2E_PROBE: ${{ github.workspace }}/apps/desktop/probe-build/agent-relay-probe
        run: cargo test --manifest-path probe/Cargo.toml --locked --features gtk --test linux_app_core_e2e -- --nocapture

      # The app starts with no display server of its own, hosts the fake
      # core, and subscribes to it.
      - name: Smoke test the app's startup
        if: needs.changes.outputs.linux_integration == 'true'
        env:
          RELAY_DESKTOP_PROBE: ${{ github.workspace }}/apps/desktop/probe/target/debug/agent-relay-fake-core
          AGENT_RELAY_CORE_SOCKET: ${{ runner.temp }}/gtk-core/core.sock
          FAKE_CORE_LOG: ${{ runner.temp }}/gtk-fake-core-calls.txt
        # The app runs in its own process group with its display, and the
        # group stops afterwards: an app left running keeps
        # com.agentrelay.desktop on the session bus, so the next app to start
        # hands its command line to it and exits. The hosted core has its own
        # group and stops when the app's end closes its stdin.
        run: |
          setsid xvfb-run --auto-servernum ./probe/target/debug/agent-relay-desktop --background &
          app=$!
          for _ in $(seq 240); do
            grep -qx subscribe "$FAKE_CORE_LOG" 2>/dev/null && grep -qx telemetry.record "$FAKE_CORE_LOG" && break
            kill -0 "$app" || break
            sleep 0.25
          done
          cat "$FAKE_CORE_LOG" || true
          grep -qx subscribe "$FAKE_CORE_LOG"
          grep -qx telemetry.record "$FAKE_CORE_LOG"
          # Still running: startup did not crash after the handshake.
          sleep 2
          kill -0 "$app"
          kill -- -"$app"
          wait "$app" || true
          # The app is xvfb-run's child: it ends, and is reaped, after
          # xvfb-run does.
          for _ in $(seq 40); do
            pgrep -f 'probe/target/debug/agent-relay-desktop' >/dev/null || break
            sleep 0.25
          done
          ! pgrep -f 'probe/target/debug/agent-relay-desktop'

  macos:
    # Legacy architecture labels are compatibility completion gates over the
    # SELECTED matrix; the summary states actual and deferred native coverage.
    name: macOS ${{ matrix.arch }}
    needs: [changes, macos-package, macos-swift-tests, macos-core-tests]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Check all selected macOS lanes
        working-directory: ${{ github.workspace }}
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHANGED: ${{ needs.changes.outputs.macos }}
          CORE_CHANGED: ${{ needs.changes.outputs.macos_core }}
          PACKAGE_CHANGED: ${{ needs.changes.outputs.macos_package }}
          SKIP_PACKAGES: ${{ inputs.skip-packages && 'true' || 'false' }}
          SELECTED_ARCHITECTURES: ${{ inputs.full-matrix && 'arm64, x64' || 'arm64' }}
          DEFERRED_ARCHITECTURES: ${{ inputs.full-matrix && 'none' || 'x64 (pre-release)' }}
          MACOS_PACKAGE_RESULT: ${{ needs.macos-package.result }}
          MACOS_SWIFT_TESTS_RESULT: ${{ needs.macos-swift-tests.result }}
          MACOS_CORE_TESTS_RESULT: ${{ needs.macos-core-tests.result }}
        run: |
          {
            echo 'This legacy architecture label is a compatibility completion gate over the selected matrix.'
            echo "Native architectures tested when this component is selected: $SELECTED_ARCHITECTURES"
            echo "Architectures deferred: $DEFERRED_ARCHITECTURES"
            echo "Swift tests selected: $CHANGED; core tests selected: $CORE_CHANGED; packaging selected: $PACKAGE_CHANGED; unsigned package checks skipped: $SKIP_PACKAGES"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$CHANGES_RESULT" = success
          case "$CHANGED" in true|false) ;; *) exit 1 ;; esac
          case "$SKIP_PACKAGES" in true|false) ;; *) exit 1 ;; esac
          case "$PACKAGE_CHANGED" in true|false) ;; *) exit 1 ;; esac
          if [ "$PACKAGE_CHANGED" = true ]; then test "$CHANGED" = true; fi
          if [ "$CHANGED" = true ]; then
            test "$MACOS_SWIFT_TESTS_RESULT" = success
          else
            test "$MACOS_SWIFT_TESTS_RESULT" = skipped
          fi
          if [ "$PACKAGE_CHANGED" = true ] && [ "$SKIP_PACKAGES" = false ]; then
            test "$MACOS_PACKAGE_RESULT" = success
          else
            test "$MACOS_PACKAGE_RESULT" = skipped
          fi
          case "$CORE_CHANGED" in true|false) ;; *) exit 1 ;; esac
          if [ "$CORE_CHANGED" = true ]; then
            test "$MACOS_CORE_TESTS_RESULT" = success
          else
            test "$MACOS_CORE_TESTS_RESULT" = skipped
          fi

