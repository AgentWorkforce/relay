name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

# Reusable workflows cannot elevate the caller's token permissions.
# detect-changes.yml reads pull-request file lists and commit comparisons.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # NPM audit for known vulnerabilities
  npm-audit:
    name: NPM Audit
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "=== Running npm audit ==="
          # Audit runtime deps only; keep non-blocking while known backlog is burned down.
          npm audit --audit-level=high --omit=dev || {
            echo ""
            echo "WARNING: Vulnerabilities found. Review and fix or document exceptions."
            echo "Run 'npm audit' locally for details."
          }

  # Dependency review for PRs
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # This job requires the dependency graph to be enabled in repo settings
    # Make it non-blocking until that's configured
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Allow specific packages if needed
          # allow-licenses: MIT, Apache-2.0

  # CodeQL analysis for code security
  codeql:
    name: CodeQL Analysis
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  # Guard against relay#1570: live credentials in a spawned process's argv.
  # The broker configures agent CLIs through their own command lines, so a
  # credential inlined there is readable via `ps` by every other process on the
  # host. This drives the real spawn path with sentinel credentials and fails if
  # any of them survive into argv.
  #
  # Gated on Rust changes because argv construction lives entirely in the broker
  # crate; the weekly schedule catches drift from anywhere else.
  argv-secret-guard:
    name: Argv Secret Guard
    needs: changes
    if: needs.changes.outputs.rust_changed == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build broker
        run: cargo build -p agent-relay-broker --bin agent-relay-broker

      - name: Check that no credential reaches argv
        run: node scripts/check-argv-secrets.mjs

  # Secret scanning (check for accidentally committed secrets)
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # Make non-blocking - review findings manually
    # Can be made blocking once allowlist is configured
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run gitleaks
        run: |
          ./gitleaks detect --source . --verbose --redact --config .github/gitleaks.toml || {
            echo ""
            echo "WARNING: Potential secrets detected in codebase."
            echo "Review the findings above and remove or rotate any exposed secrets."
            exit 1
          }

  # License compliance check
  license-check:
    name: License Compliance
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          echo "=== Checking dependency licenses ==="
          npx license-checker --production --summary || true

          # Check for problematic licenses
          echo ""
          echo "Checking for restricted licenses..."
          RESTRICTED=$(npx license-checker --production --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;BlueOak-1.0.0;CC-BY-4.0" 2>&1 || true)

          if echo "$RESTRICTED" | grep -q "UNKNOWN"; then
            echo "WARNING: Some packages have unknown licenses"
            echo "$RESTRICTED" | grep "UNKNOWN" | head -20
          fi

          echo "License check complete"
