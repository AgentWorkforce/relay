name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: Distribution scope (upload does not submit for review)
        type: choice
        options:
          - internal
          - app-store
        default: internal

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/desktop

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload iOS
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require current iOS SDK
        run: |
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [ "${sdk_version%%.*}" -lt 26 ]; then
            echo "::error::iOS 26 SDK or newer is required for App Store Connect uploads; found $sdk_version"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare App Store Connect authentication
        env:
          APPLE_MOBILE_API_KEY_BASE64: ${{ secrets.APPLE_MOBILE_API_KEY_BASE64 }}
          APPLE_MOBILE_API_KEY_ID: ${{ secrets.APPLE_MOBILE_API_KEY_ID }}
          APPLE_MOBILE_API_ISSUER: ${{ secrets.APPLE_MOBILE_API_ISSUER }}
        run: |
          set -euo pipefail
          for name in APPLE_MOBILE_API_KEY_BASE64 APPLE_MOBILE_API_KEY_ID APPLE_MOBILE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required App Store Connect secret: $name"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_MOBILE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"

      - name: Generate Xcode project
        run: xcodegen generate --spec ipad/native/project.yml

      - name: Archive iPhone and iPad app
        env:
          APPLE_MOBILE_API_KEY_ID: ${{ secrets.APPLE_MOBILE_API_KEY_ID }}
          APPLE_MOBILE_API_ISSUER: ${{ secrets.APPLE_MOBILE_API_ISSUER }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ipad/native/AgentRelayiPad.xcodeproj \
            -scheme AgentRelayiPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AgentRelayMobile.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_MOBILE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_MOBILE_API_ISSUER" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Preserve production push entitlement for cloud signing
        run: |
          set -euo pipefail
          entitlements="$RUNNER_TEMP/production-push.entitlements"
          cp ipad/native/Sources/AgentRelayiPad.entitlements "$entitlements"
          plutil -replace aps-environment -string production "$entitlements"
          codesign --force --sign - --entitlements "$entitlements" \
            "$RUNNER_TEMP/AgentRelayMobile.xcarchive/Products/Applications/AgentRelayiPad.app"

      - name: Upload to App Store Connect
        env:
          MOBILE_DISTRIBUTION: ${{ inputs.distribution }}
          APPLE_MOBILE_API_KEY_ID: ${{ secrets.APPLE_MOBILE_API_KEY_ID }}
          APPLE_MOBILE_API_ISSUER: ${{ secrets.APPLE_MOBILE_API_ISSUER }}
        run: |
          set -euo pipefail
          case "$MOBILE_DISTRIBUTION" in
            internal) export_options=ipad/native/ExportOptions.plist ;;
            app-store) export_options=ipad/native/ExportOptions-AppStore.plist ;;
            *) echo "::error::Unknown distribution scope"; exit 1 ;;
          esac
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AgentRelayMobile.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -exportPath "$RUNNER_TEMP/AgentRelayMobileUpload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_MOBILE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_MOBILE_API_ISSUER" \
            -skipPackagePluginValidation
