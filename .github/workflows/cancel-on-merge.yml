name: Cancel PR Jobs on Merge

on:
  # Use the base repository's token for fork PRs. This workflow only calls
  # the Actions API; it must never check out or execute PR code.
  pull_request_target:
    types: [closed]

jobs:
  cancel:
    if: github.event.pull_request.merged == true
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Cancel running workflows for this PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const headSha = pr.head.sha;

            // Collect all pages before cancelling, since cancellations change
            // the result set. Include queued jobs as well as running ones.
            const runs = new Map();
            for (const status of ['queued', 'in_progress']) {
              const matches = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                { owner, repo, status, event: 'pull_request', head_sha: headSha, per_page: 100 },
              );
              for (const run of matches) {
                if (run.id !== context.runId) runs.set(run.id, run);
              }
            }

            let uniqueHeadPr;
            async function belongsToMergedPr(run) {
              if (run.event !== 'pull_request' || run.head_sha !== headSha) return false;
              if (run.pull_requests?.length) {
                return run.pull_requests.some(candidate => candidate.number === pr.number);
              }
              // GitHub omits pull_requests for fork runs. Confirm the exact
              // head repository/branch, then require this to be its ONLY PR
              // across all states and bases. Ambiguity must leave runs alone.
              const headRepo = pr.head.repo;
              if (!headRepo?.owner?.login || run.head_repository?.id !== headRepo.id ||
                  run.head_branch !== pr.head.ref) return false;
              if (uniqueHeadPr === undefined) {
                const candidates = await github.paginate(github.rest.pulls.list, {
                  owner, repo, state: 'all',
                  head: `${headRepo.owner.login}:${pr.head.ref}`, per_page: 100,
                });
                uniqueHeadPr = candidates.length === 1 && candidates[0].number === pr.number &&
                  candidates[0].head.repo?.id === headRepo.id;
              }
              return uniqueHeadPr;
            }

            let cancelled = 0;
            for (const run of runs.values()) {
              if (!await belongsToMergedPr(run)) {
                console.log(`Skipping workflow run ${run.id}: PR association not confirmed`);
                continue;
              }
              console.log(`Cancelling workflow run ${run.id} (${run.name})`);
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                cancelled++;
              } catch (error) {
                // A run may finish between listing it and cancelling it.
                if (error.status !== 409) throw error;
                console.log(`Workflow run ${run.id} is no longer cancellable`);
              }
            }

            console.log(`Cancelled ${cancelled} workflow runs`);
