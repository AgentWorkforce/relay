name: Detect Changes

# Reusable change-scope detection so each CI workflow only runs the jobs a
# change can actually affect. Callers gate jobs on the outputs below:
#
#   node_changed      — Node/TypeScript jobs (npm test, lint, package validation).
#   sdk_swift_changed — Swift SDK jobs (swift build/test)
#
# crates/relay-node/ selects none of these, because Relay node CI covers it on its own
# paths. The exceptions are protocol.rs, which selects node_changed, and the
# generated contract/CoreContract.swift, which selects sdk_swift_changed.
#
# When the change scope is unknown (API failure, truncated file list,
# unexpected event) every output is true — fail open, never silently skip.

on:
  workflow_call:
    outputs:
      node_changed:
        description: 'True when anything affecting the Node/TypeScript toolchain changed'
        value: ${{ jobs.changes.outputs.node_changed }}
      sdk_swift_changed:
        description: 'True when the Swift SDK (packages/sdk-swift/, Package.swift) or CI config changed'
        value: ${{ jobs.changes.outputs.sdk_swift_changed }}

# Read-only: listFiles needs pull-requests read, compareCommits needs
# contents read. Never inherit broader caller permissions.
permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      node_changed: ${{ steps.scope.outputs.node_changed }}
      sdk_swift_changed: ${{ steps.scope.outputs.sdk_swift_changed }}
    steps:
      - id: scope
        uses: actions/github-script@v7
        with:
          script: |
            let files = [];
            let unknownScope = false;

            try {
              if (context.eventName === 'pull_request') {
                const changed = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  per_page: 100,
                });
                // Renames classify BOTH paths: removing the old location can
                // affect a domain the new location doesn't.
                files = changed.flatMap((file) =>
                  [file.filename, file.previous_filename].filter(Boolean)
                );
                // listFiles caps at 3000 entries; at the cap the list may be
                // truncated.
                if (changed.length >= 3000) unknownScope = true;
              } else if (context.eventName === 'push') {
                const comparison = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: context.payload.before,
                  head: context.sha,
                });
                const changedFiles = comparison.data.files || [];
                files = changedFiles.flatMap((file) =>
                  [file.filename, file.previous_filename].filter(Boolean)
                );
                // compareCommits caps the file list at 300 entries; at the cap
                // the list may be truncated.
                if (changedFiles.length >= 300) unknownScope = true;
              } else {
                unknownScope = true;
              }
            } catch (error) {
              core.warning(`Change detection failed: ${error?.message}`);
              unknownScope = true;
            }

            if (files.length === 0) unknownScope = true;

            const isCi = (file) => file.startsWith('.github/');
            // The Swift SDK's CoreContractTests compile the generated bridge
            // contract through a symlink, so a contract change selects them.
            const isSwift = (file) =>
              file.startsWith('packages/sdk-swift/') ||
              file === 'Package.swift' ||
              file === 'crates/relay-node/contract/CoreContract.swift';
            // Agent implementations and their tests are part of the Node test
            // surface. Other AgentWorkforce records remain inert metadata.
            const isAgentRuntime = (file) =>
              file.startsWith('.agentworkforce/agents/');
            // Files no build, test, or lint job consumes.
            const isInert = (file) =>
              file.startsWith('web/') ||
              file.startsWith('docs/') ||
              file.startsWith('specs/') ||
              file.startsWith('.claude/') ||
              (file.startsWith('.agentworkforce/') && !isAgentRuntime(file)) ||
              file.startsWith('.agents/') ||
              file === 'LICENSE' ||
              (/\.mdx?$/i.test(file) && !file.includes('/'));

            // The core reaches Node only through the pinned release, so Relay
            // node CI covers it. The bridge protocol stays Node-affecting:
            // relay-node.test.ts reads it.
            const isCore = (file) => file.startsWith('crates/relay-node/');
            const isCoreOnly = (file) =>
              isCore(file) && file !== 'crates/relay-node/src/relay/protocol.rs';

            const classifyFiles = (changedFiles) => ({
              nodeChanged: changedFiles.some(
                (file) => !isSwift(file) && !isInert(file) && !isCoreOnly(file)
              ),
              sdkSwiftChanged: changedFiles.some(
                (file) => isSwift(file) || isCi(file)
              ),
            });

            // Exercise the exact production classifier with an agent-only
            // change so future broad inert-path rules fail visibly.
            const agentRuntimeProbe = classifyFiles([
              '.agentworkforce/agents/ci-scope-probe.ts',
            ]);
            core.info(
              `agent_runtime_probe node_changed=${agentRuntimeProbe.nodeChanged} sdk_swift_changed=${agentRuntimeProbe.sdkSwiftChanged}`
            );
            if (
              !agentRuntimeProbe.nodeChanged ||
              agentRuntimeProbe.sdkSwiftChanged
            ) {
              throw new Error('Agent-only scope probe must select only Node jobs');
            }

            const detectedScope = classifyFiles(files);
            const nodeChanged = unknownScope || detectedScope.nodeChanged;
            const sdkSwiftChanged = unknownScope || detectedScope.sdkSwiftChanged;

            core.info(`Changed files (${files.length}): ${files.join(', ')}`);
            core.info(
              `unknownScope=${unknownScope} node_changed=${nodeChanged} sdk_swift_changed=${sdkSwiftChanged}`
            );
            core.setOutput('node_changed', nodeChanged ? 'true' : 'false');
            core.setOutput('sdk_swift_changed', sdkSwiftChanged ? 'true' : 'false');
