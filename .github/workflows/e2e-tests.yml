name: E2E Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '!packages/sdk-swift/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/e2e-test.sh'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    # Trunk -> main promotion PR only, and only on purpose: CI runs when the
    # `ci:run` label is added (by the merge train, or an agent once the PR is
    # ready). Opened, reopened and synchronize run nothing; any other label
    # skips every job.
    types: [labeled]
    branches: [main]
    paths:
      - 'packages/**'
      - '!packages/sdk-swift/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/e2e-test.sh'
      - 'package.json'
      - '.github/workflows/e2e-tests.yml'
  # Allow manual trigger for on-demand testing
  workflow_dispatch:

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: e2e-tests-${{ github.event_name == 'push' && format('push-{0}', github.sha) || github.event_name != 'pull_request' && format('run-{0}', github.run_id) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENT_RELAY_TELEMETRY_DISABLED: 1

jobs:
  e2e-test:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    name: E2E Integration Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.14.0]
      fail-fast: false

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Build project
        run: npm run build

      - name: Link CLI for local testing
        run: cd packages/cli && npm link

      - name: Verify CLI is available
        run: agent-relay --version

      - name: Cache Claude CLI
        id: cache-claude
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: claude-cli-${{ runner.os }}-${{ hashFiles('.github/workflows/e2e-tests.yml') }}

      - name: Install Claude CLI
        if: steps.cache-claude.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'
          npm install -g @anthropic-ai/claude-code

      - name: Add Claude CLI to PATH
        run: |
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
          export PATH="$HOME/.npm-global/bin:$PATH"
          claude --version || echo "Claude CLI ready"

      - name: Check for API key
        id: check-key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "::warning::ANTHROPIC_API_KEY not set - Claude spawn test will be skipped"
          fi

      - name: Run E2E test
        id: e2e-test
        if: steps.check-key.outputs.has_key == 'true'
        timeout-minutes: 5
        run: ./scripts/e2e-test.sh --port 3888

      - name: Run daemon-only test (no API key)
        if: steps.check-key.outputs.has_key == 'false'
        timeout-minutes: 2
        run: ./scripts/e2e-test.sh --daemon-only --port 3888

      - name: Test Summary
        if: always()
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **OS:** ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Key Present:** ${{ steps.check-key.outputs.has_key }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.e2e-test.outcome }}" == "success" ]; then
            echo "- **Status:** Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.e2e-test.outcome }}" == "skipped" ]; then
            echo "- **Status:** Skipped (no API key)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Status:** Failed" >> $GITHUB_STEP_SUMMARY
          fi
