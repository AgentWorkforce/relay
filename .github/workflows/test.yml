name: Test

on:
  push:
    branches: [main]
  pull_request:
    # Trunk -> main promotion PR only, and only on purpose: CI runs when the
    # `ci:run` label is added (by the merge train, or an agent once the PR is
    # ready). Opened, reopened and synchronize run nothing; any other label
    # skips every job.
    types: [labeled]
    branches: [main]

# Reusable workflows cannot elevate the caller's token permissions.
# detect-changes.yml reads pull-request file lists and commit comparisons.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: test-${{ github.event_name == 'push' && format('push-{0}', github.sha) || github.event_name != 'pull_request' && format('run-{0}', github.run_id) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENT_RELAY_TELEMETRY_DISABLED: 1

jobs:
  changes:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')
    uses: ./.github/workflows/detect-changes.yml

  test:
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (vars.CI_LINUX_RUNNER || 'ubuntu-latest') || matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22.14.0']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # StarSling Linux runners (vars.CI_LINUX_RUNNER) preinstall rustc 1.92, older
      # than GitHub's ubuntu-24.04 image (1.99); 1.92 cannot compile the
      # broker (stable-only atomic try_update). Install the toolchain explicitly.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Check PR proof transfer guards
        run: node --test scripts/pr-proof/broker-transfer.test.mjs scripts/pr-proof/run-cloud.test.mjs scripts/flows/deploy-listeners.test.mjs scripts/pr-proof/event-from-input.test.mjs

      - name: Check subscription proof guards
        run: npm run test:subscriptions:proof

      - name: Run tests
        run: npm test

  # The PR-proof Landlock / devpts / no_new_privs sandbox tests skip themselves
  # (it.skipIf(!HAS_TRUSTED_LANDLOCK_RUNTIME)) on kernels that cannot host the
  # sandbox, which includes the StarSling runners that `test` above may run on
  # via vars.CI_LINUX_RUNNER. This job stays pinned to GitHub's ubuntu-latest
  # (never the runner variable) and fails if any test in the file is skipped,
  # so those tests can never silently stop running.
  sandbox-proof:
    name: PR-proof sandbox tests (Landlock, ubuntu-latest)
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Run PR-proof sandbox tests
        run: npx vitest run tests/fixtures/pr-proof-contract.test.ts --reporter=default --reporter=json --outputFile.json=pr-proof-results.json

      - name: Require every PR-proof test to have run
        run: |
          node -e '
            const r = require("./pr-proof-results.json");
            const all = r.testResults.flatMap((f) => f.assertionResults);
            const notRun = all.filter((t) => t.status !== "passed" && t.status !== "failed");
            console.log("pr-proof-contract: " + all.length + " tests, " + notRun.length + " not run");
            for (const t of notRun) console.log("::error::not run (" + t.status + "): " + t.fullName);
            if (all.length === 0 || notRun.length > 0) process.exit(1);
          '

  windows-credential-acl:
    name: Windows credential ACL validation
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run Windows credential ACL tests
        run: >-
          npx vitest run
          packages/cloud/src/credential-directory-windows.test.ts
          packages/cloud/src/credential-directory-windows.native.test.ts
          --pool=forks --maxWorkers=1

      - name: Verify concurrent Windows credential writes
        run: >-
          npx vitest run packages/cloud/src/workspace-store.test.ts
          --testNamePattern="preserves concurrent credential writes"
          --pool=forks --maxWorkers=1

  coverage:
    name: Coverage (upload)
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # StarSling Linux runners (vars.CI_LINUX_RUNNER) preinstall rustc 1.92, older
      # than GitHub's ubuntu-24.04 image (1.99); 1.92 cannot compile the
      # broker (stable-only atomic try_update). Install the toolchain explicitly.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info

  lint:
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  swift-test:
    name: Swift SDK Tests
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && github.event.action == 'labeled' && github.event.label.name == 'ci:run')) &&
      (needs.changes.outputs.sdk_swift_changed == 'true')
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/sdk-swift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Consumers that depend on this repo by git URL resolve the ROOT
      # Package.swift, which must mirror the package manifest — build it too
      # so a root-manifest change can't ship broken.
      - name: Build root manifest
        working-directory: ${{ github.workspace }}
        run: swift build
