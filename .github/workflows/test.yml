name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Reusable workflows cannot elevate the caller's token permissions.
# detect-changes.yml reads pull-request file lists and commit comparisons.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AGENT_RELAY_TELEMETRY_DISABLED: 1

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  test:
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22.14.0']
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Check subscription proof guards
        run: npm run test:subscriptions:proof

      - name: Run tests
        run: npm test

  windows-credential-acl:
    name: Windows credential ACL validation
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run Windows credential ACL tests
        run: >-
          npx vitest run
          packages/cloud/src/credential-directory-windows.test.ts
          packages/cloud/src/credential-directory-windows.native.test.ts
          --pool=forks --maxWorkers=1

      - name: Verify concurrent Windows credential writes
        run: >-
          npx vitest run packages/cloud/src/workspace-store.test.ts
          --testNamePattern="preserves concurrent credential writes"
          --pool=forks --maxWorkers=1

  coverage:
    name: Coverage (upload)
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info

  lint:
    needs: changes
    if: needs.changes.outputs.node_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  swift-test:
    name: Swift SDK Tests
    needs: changes
    if: needs.changes.outputs.sdk_swift_changed == 'true'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/sdk-swift
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Consumers that depend on this repo by git URL resolve the ROOT
      # Package.swift, which must mirror the package manifest — build it too
      # so a root-manifest change can't ship broken.
      - name: Build root manifest
        working-directory: ${{ github.workspace }}
        run: swift build
