name: Node.js Compatibility

on:
  push:
    branches: [main]
  pull_request:
    # Trunk -> main promotion PR only, batched by the merge train (AgentWorkforce/cloud
    # packages/web/lib/merge-train): opened, reopened, or the sweeper's `ci:run`
    # label once per new trunk head. Never on synchronize; other label events
    # skip every job.
    types: [opened, reopened, labeled]
    branches: [main]

# Reusable workflows cannot elevate the caller's token permissions.
# detect-changes.yml reads pull-request file lists and commit comparisons.
permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: node-compat-${{ github.event_name != 'pull_request' && format('push-{0}', github.sha) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))
    uses: ./.github/workflows/detect-changes.yml
  install-test:
    name: Install Test (Node ${{ matrix.node-version }})
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 25 excluded - better-sqlite3 doesn't have prebuilt binaries yet
        # and fails to compile with Node 25's V8 API changes
        node-version: ['22.14.0', '24']
      fail-fast: false

    container:
      image: node:${{ matrix.node-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Install native process identity test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends lsof procps

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup optional dependencies are installed
        run: npm install --no-save rollup || true

      - name: Verify native modules compiled
        run: |
          echo "Checking that native modules exist..."
          ls -la node_modules/better-sqlite3/build/Release/ || echo "better-sqlite3 not built (optional)"
          echo "Native module check complete"

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test local import (ESM)
        run: |
          # Test that the built package can be imported locally
          node --eval "
            import('./packages/cli/dist/index.js').then(m => {
              console.log('Local ESM import successful');
              console.log('Exports:', Object.keys(m));
            }).catch(err => {
              console.error('Local ESM import failed:', err.message);
              process.exit(1);
            });
          "

  # Test that npm install works in a fresh environment
  fresh-install:
    name: Fresh Install (Node ${{ matrix.node-version }})
    needs: changes
    if: >-
      ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))) &&
      (needs.changes.outputs.node_changed == 'true')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 25 excluded - better-sqlite3 doesn't support it yet
        node-version: ['22.14.0', '24']
      fail-fast: false

    container:
      image: node:${{ matrix.node-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Node.js version
        run: |
          node --version
          npm --version

      - name: Upgrade npm before fresh resolution
        # npm <=10.9.x's arborist crashes re-resolving the harnesses
        # package's peer set with no lockfile present (npm/cli#8261) — an
        # npm-version bug, not a Node-version one (npm/cli#8261). Pinned on
        # both matrix legs so this job stays a clean Node-compat signal instead
        # of being confounded by whichever npm happens to ship with each Node
        # image.
        run: npm install -g npm@11.19.1

      - name: Clean install
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Verify installation succeeded
        run: |
          echo "Dependencies installed successfully on Node $(node --version)"
          echo "Checking key dependencies..."
          ls node_modules/better-sqlite3 && echo "better-sqlite3: OK"
          ls node_modules/express && echo "express: OK"
          ls node_modules/ws && echo "ws: OK"
          echo "All key dependencies present"
