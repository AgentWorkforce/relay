name: Fleet E2E

# Two-node fleet scenario matrix (RFC #1056, Phase 6). Boots a real relaycast
# engine + two `agent-relay node up` nodes (each a Rust broker + TS sidecar)
# and drives the live control wire. Heavier than the unit suite (builds the Rust
# broker + the relaycast engine), so it runs on its own workflow, gated to fleet
# paths. The scenario matrix itself runs in well under a minute (~30s locally);
# the wall-clock is dominated by the cold build (cargo + two npm installs +
# engine build), which rust-cache amortises on warm runs. The 20-minute job
# timeout is a cold-build ceiling, not the matrix runtime.

# NOTE on branches: CI runs only on this repository's `trunk` -> `main` PR and
# on pushes to `main` (see the job `if:`). Feature branches, including
# `feat/fleet-*`, merge into `trunk` without CI.
on:
  push:
    branches: [main]
    paths:
      - 'packages/fleet/**'
      - 'packages/cli/**'
      - 'packages/harness-driver/**'
      - 'crates/broker/**'
      - 'crates/relay-pty/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/fleet/**'
      - 'vitest.e2e.config.ts'
      - '.github/workflows/fleet-e2e.yml'
  pull_request:
    # Trunk -> main promotion PR only, batched by the merge train (AgentWorkforce/cloud
    # packages/web/lib/merge-train): opened, reopened, or the sweeper's `ci:run`
    # label once per new trunk head. Never on synchronize; other label events
    # skip every job.
    types: [opened, reopened, labeled]
    branches: [main, 'feat/fleet-**']
    paths:
      - 'packages/fleet/**'
      - 'packages/cli/**'
      - 'packages/harness-driver/**'
      - 'crates/broker/**'
      - 'crates/relay-pty/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/e2e/fleet/**'
      - 'vitest.e2e.config.ts'
      - '.github/workflows/fleet-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs collapse per pull request; push runs key off the commit sha so two
  # merges landing together cannot cancel each other. A `labeled` event for any
  # label other than `ci:run` runs nothing, so it gets its own throwaway group:
  # it must never cancel the PR's in-progress run.
  group: fleet-e2e-${{ github.event_name != 'pull_request' && format('push-{0}', github.sha) || ((github.event.action == 'labeled' && github.event.label.name != 'ci:run') && format('ignored-{0}', github.run_id) || format('pr-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AGENT_RELAY_TELEMETRY_DISABLED: 1

jobs:
  fleet-e2e:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.head_ref == 'trunk' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && (github.event.action != 'labeled' || github.event.label.name == 'ci:run'))
    name: Two-node fleet matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout relay
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The relaycast engine lives in a separate repo. This E2E drives the
      # node-provider model and heartbeats whose load may be unreported for
      # unbounded providers. This companion PR candidate supplies isolated
      # registration, acknowledged cleanup and node-owned spawn status reads.
      # It is a test pin, not a released or deployed product dependency.
      - name: Checkout relaycast engine (node-provider model)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: AgentWorkforce/relaycast
          ref: a5c7ac66f64a650274fbe2c60e3cd5d3c9b87dcd # relaycast#387: verified served-node spawn completion
          path: relaycast-engine

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'npm'

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build relay (CLI + fleet + harness-driver)
        run: |
          npm ci
          npm run build:core

      - name: Build agent-relay-broker
        run: cargo build --release --bin agent-relay-broker

      - name: Build relaycast engine
        working-directory: relaycast-engine
        run: |
          npm ci
          npm run build --workspace @relaycast/types
          npm run build --workspace @relaycast/a2a
          npm run build --workspace @relaycast/engine

      - name: Run two-node fleet E2E
        env:
          RELAYCAST_ENGINE_DIR: ${{ github.workspace }}/relaycast-engine
          BROKER_BINARY_PATH: ${{ github.workspace }}/target/release/agent-relay-broker
        run: npm run test:e2e

      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-e2e-logs
          path: /tmp/fleet-e2e-*/**/serve.log
          if-no-files-found: ignore
