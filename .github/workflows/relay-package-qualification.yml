name: Relay package qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-package-qualification-${{ github.sha }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact producer source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require exact canonical prerelease source
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "AgentWorkforce/relay"
          case "${GITHUB_REF}" in
            refs/heads/qualification/*) ;;
            *) echo "qualification must run from refs/heads/qualification/*" >&2; exit 1 ;;
          esac
          test -n "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0

      - name: Require prerelease package version
        run: |
          node --input-type=module -e "import { assertPrereleaseVersion } from './scripts/verify-features/relay-package-qualification.mjs'; import packageJson from './package.json' with { type: 'json' }; assertPrereleaseVersion(packageJson.version);"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build and stage the exact Linux broker candidate
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools
          relay_version="$(node -p "require('./package.json').version")"
          AGENT_RELAY_VERSION="${relay_version}" RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --locked --release --bin agent-relay-broker --target x86_64-unknown-linux-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/agent-relay-broker \
            packages/broker-linux-x64/bin/agent-relay-broker
          test "$(packages/broker-linux-x64/bin/agent-relay-broker --version)" = \
            "agent-relay-broker ${relay_version}"

      - name: Install and build the exact producer source
        run: |
          npm install --global npm@10.9.7
          npm ci
          npm run build:core

      - name: Pack and clean-install the complete Linux candidate closure
        run: |
          node scripts/verify-features/relay-candidate-install.mjs prepare \
            --output "${RUNNER_TEMP}/relay-candidate-install"
          node scripts/verify-features/relay-candidate-install.mjs verify \
            --attestation "${RUNNER_TEMP}/relay-candidate-install/candidate-install-attestation.json"

      - name: Require a unique unpublished candidate package version
        run: |
          node scripts/verify-features/relay-package-qualification.mjs verify-candidate-unpublished \
            --candidate-attestation "${RUNNER_TEMP}/relay-candidate-install/candidate-install-attestation.json"

      - name: Create source-bound package payload
        run: |
          node scripts/verify-features/relay-package-qualification.mjs create-payload \
            --source-sha "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --candidate-attestation "${RUNNER_TEMP}/relay-candidate-install/candidate-install-attestation.json" \
            --candidate-tarballs "${RUNNER_TEMP}/relay-candidate-install/tarballs" \
            --output .qualification/payload/relay-package-attestation.json
          node scripts/verify-features/relay-package-qualification.mjs validate \
            --kind payload \
            --file .qualification/payload/relay-package-attestation.json

      - name: Verify every attested package version exists
        run: |
          node scripts/verify-features/relay-package-qualification.mjs verify-files \
            --file .qualification/payload/relay-package-attestation.json \
            --directory .qualification/payload
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const payload = require('./.qualification/payload/relay-package-attestation.json');
          for (const [name, { version }] of Object.entries(payload.registry)) {
            const raw = execFileSync('npm', ['view', `${name}@${version}`, 'version', '--json'], {
              encoding: 'utf8',
              stdio: ['ignore', 'pipe', 'inherit'],
            });
            const resolved = JSON.parse(raw);
            if (resolved !== version) throw new Error(`${name}@${version} is not an exact published package`);
          }
          NODE

      - name: Upload immutable package payload
        id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-package-qualification
          path: .qualification/payload/
          if-no-files-found: error
          retention-days: 30

      - name: Seal payload artifact identity
        env:
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          node scripts/verify-features/relay-package-qualification.mjs create-envelope \
            --payload .qualification/payload/relay-package-attestation.json \
            --artifact-digest "${PAYLOAD_ARTIFACT_DIGEST}" \
            --output .qualification/attestation/relay-package-qualification-attestation.json
          node scripts/verify-features/relay-package-qualification.mjs validate \
            --kind envelope \
            --file .qualification/attestation/relay-package-qualification-attestation.json

      - name: Upload immutable package attestation
        id: attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-package-qualification-attestation
          path: .qualification/attestation/relay-package-qualification-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Emit Cloud qualification request
        env:
          ATTESTATION_ARTIFACT_DIGEST: ${{ steps.attestation.outputs.artifact-digest }}
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const request = {
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            attestationArtifactDigest: process.env.ATTESTATION_ARTIFACT_DIGEST,
          };
          console.log('## Cloud Relay producer request\n');
          console.log('```json');
          console.log(JSON.stringify(request));
          console.log('```');
          NODE
