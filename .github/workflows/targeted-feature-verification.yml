name: Targeted feature verification

# A PR should pay for the smallest verification slice that can honestly cover
# its affected feature. The selector maps changed files through the feature
# manifest and cleanroom matrix. Unmapped runtime files fail closed into the
# complete smoke profile; they never become a green skip.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.agentworkforce/trajectories/**'
      - 'docs/**'
      - 'specs/**'
      - 'web/**'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      base_sha:
        description: Full base commit SHA
        required: true
        type: string
      head_sha:
        description: Full head commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: targeted-feature-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targeted:
    name: Flows v2 targeted slice
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AGENT_RELAY_TELEMETRY_DISABLED: '1'
      RELAYFLOWS_SANDBOX_PROVIDER: local-process
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-bin: false

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Install pinned Relayflows runtime
        run: |
          mkdir -p "$RUNNER_TEMP/relayflowd-runtime"
          npm pack --ignore-scripts \
            --pack-destination "$RUNNER_TEMP/relayflowd-runtime" \
            @relayflows/runtime-linux-x64@2.0.20
          tar -xzf "$RUNNER_TEMP/relayflowd-runtime/relayflows-runtime-linux-x64-2.0.20.tgz" \
            -C "$RUNNER_TEMP/relayflowd-runtime"
          chmod +x "$RUNNER_TEMP/relayflowd-runtime/package/bin/relayflowd"
          echo "RELAYFLOWD_BIN=$RUNNER_TEMP/relayflowd-runtime/package/bin/relayflowd" >> "$GITHUB_ENV"

      - name: Select affected features and scenarios
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p .workflow-artifacts/targeted-pr
          node scripts/verify-features/targeted-pr-plan.mjs plan \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output .workflow-artifacts/targeted-pr/plan.json

      - name: Generate and check Flows v2 spec
        run: |
          node --experimental-strip-types flows/verify/targeted-pr.spec.ts \
            --plan .workflow-artifacts/targeted-pr/plan.json \
            --out .workflow-artifacts/flows/relay.verify.targeted-pr.json
          npx flows check .workflow-artifacts/flows/relay.verify.targeted-pr.json

      - name: Run targeted verification
        run: >-
          npx flows run --no-observer-link
          --data-dir .workflow-artifacts/targeted-pr/relayflowd
          .workflow-artifacts/flows/relay.verify.targeted-pr.json

      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: targeted-feature-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .workflow-artifacts/targeted-pr/plan.json
            .workflow-artifacts/flows/relay.verify.targeted-pr.json
          if-no-files-found: error
          retention-days: 14
