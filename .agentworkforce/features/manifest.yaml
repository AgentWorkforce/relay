      - id: mcp-create-channel
        name: MCP create_channel
        mcp: create_channel
        description: Create a channel from within a harness
        location: packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: mcp-list-channels
        name: MCP list_channels
        mcp: list_channels
        description: List channels from within a harness
        location: packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: mcp-post-message
        name: MCP post_message
        mcp: post_message
