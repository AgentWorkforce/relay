version: '2.0'
updated: '2026-11-01'

# Every user-facing feature in this repo, categorized and scored.
#
# Relay's centre is `relay init`: it installs the Agent Relay core
# (crates/relay-node) and connects each agent tool, and the core injects messages
# into running sessions. The categories below start there.
#
# criticality:
#   critical - product cannot function without this; verify on every change
#   hot      - commonly used path; verify for any related change
#   standard - useful feature; verify periodically
#
# status (a category without one is current):
#   legacy - still shipped and reachable, on a path a newer surface replaces
#            (the core, or `relay flows` for relayflows v1 workflows).
#            Verified by hand on demand, never on a pull request.
#            Add nothing here that could live on the core instead.
#
# verify_tier (the primary environment needed to run verification):
#   1 - isolated local CLI/filesystem
#   2 - local Relay: the core and server `relay init` runs, in a sandboxed home
#   3 - hosted workspace plus one registered agent token
#   4 - hosted workspace plus two or more registered agent identities
#   5 - authenticated, disposable hosted workspace or external test service
#   6 - interactive provider/browser/PTY or a pre-provisioned external system
#
# Tier alone is deliberately not a test plan. Every category is mapped below
# to a procedure with precise prerequisites, setup, assertions, cleanup, and
# any automation limitation. Procedures are in verify/procedures.md.
verification:
  document: .agentworkforce/features/verify/procedures.md
  categories:
    init: relay-init
    core: core-daemon
    core-delivery: core-delivery
    agent-management: workspace-agents-and-capabilities
    messaging-channels: channel-messaging
    messaging-messages: message-round-trip
    messaging-dm: direct-messages
    messaging-reactions: reactions-and-read-status
    messaging-inbox: reactions-and-read-status
    local-workflows: local-workflow-lifecycle
    cloud: cloud-workflows
    cloud-workers: cloud-workers
    cloud-integrations: integrations-and-webhooks
    cloud-rooms: cloud-workflows
    fleet: fleet-management
    workspace: workspace-management
    skills: skills-installation
    integration: integrations-and-webhooks
    product-surfaces: product-cli-surfaces
    mcp: mcp-stdio
    sdk: typescript-sdk
    swift-sdk: swift-sdk
    opencode-plugin: opencode-plugin
    codex-relay-skill: codex-relay-skill
    gemini-relay-extension: gemini-relay-extension
    setup: cli-maintenance
    telemetry: telemetry
    node: node-command-discovery

categories:
  init:
    name: Relay Init
    description: One command that sets up a workspace, the core, and every agent tool
    criticality: critical
    features:
      - id: init-local
        name: Local Setup
        cli: relay init
        description: Run a private Relaycast server on this machine and save its workspace
        location: packages/cli/src/cli/commands/init.ts, packages/cli/src/cli/lib/relaycast-engine-install.ts
        verify_tier: 2

      - id: init-hosted
        name: Hosted Setup
        cli: relay init --hosted
        description: Create or join a hosted workspace so agents on other machines can join
        location: packages/cli/src/cli/commands/init.ts
        verify_tier: 5

      - id: init-own-server
        name: Own Server Setup
        cli: relay init --url <url> --key <key>
        description: Connect to a Relaycast server the person runs, with its workspace key
        location: packages/cli/src/cli/commands/init.ts
        verify_tier: 3

      - id: init-interactive
        name: Guided Setup
        cli: relay init --interactive
        description: Ask where agents talk, which tools to connect, and where the MCP server goes
        location: packages/cli/src/cli/commands/init.ts
        verify_tier: 6

      - id: init-delivery-mode
        name: Delivery Mode
        cli: relay init --delivery <delivery>
        description: Choose core injection (default) or the Relay MCP server for the chosen tools
        location: packages/cli/src/cli/commands/init.ts, packages/cli/src/cli/lib/agent-tools-mcp.ts
        verify_tier: 2

      - id: init-tool-claude
        name: Connect Claude Code
        cli: relay init --tools claude
        description: Turn on the session inbox and SessionStart hook in the Claude settings file
        location: packages/cli/src/cli/lib/relay-node.ts, packages/cli/src/cli/lib/init-leftovers.ts
        verify_tier: 2

      - id: init-tool-codex
        name: Connect Codex
        cli: relay init --tools codex
        description: Install the PostToolUse, Stop and SessionStart hooks in the Codex hooks file
        location: packages/cli/src/cli/lib/relay-node.ts
        verify_tier: 2

      - id: init-tool-opencode
        name: Connect OpenCode
        cli: relay init --tools opencode
        description: Install the Agent Relay plugin and its automatic activation for OpenCode
        location: packages/cli/src/cli/lib/relay-node.ts, packages/cli/src/cli/lib/init-leftovers.ts
        verify_tier: 2

      - id: init-tool-grok
        name: Connect Grok CLI
        cli: relay init --tools grok
        description: Turn on Grok's leader mode so the core can reach its sessions
        location: packages/cli/src/cli/lib/relay-node.ts
        verify_tier: 2

      - id: init-tool-pi
        name: Connect Pi
        cli: relay init --tools pi
        description: Install the Agent Relay extension and its automatic activation for Pi
        location: packages/cli/src/cli/lib/relay-node.ts, packages/cli/src/cli/lib/init-leftovers.ts
        verify_tier: 2

      - id: init-tool-devin
        name: Connect Devin
        cli: relay init --tools devin
        description: Install lifecycle hooks in the local Devin configuration
        location: packages/cli/src/cli/lib/relay-node.ts
        verify_tier: 2

      - id: init-tool-cursor
        name: Connect Cursor
        cli: relay init --tools cursor
        description: Install the hooks Cursor CLI and the Cursor editor read
        location: packages/cli/src/cli/lib/relay-node.ts, packages/cli/src/cli/lib/agent-tools-mcp.ts
        verify_tier: 2

      - id: init-mcp-fallback
        name: MCP Fallback
        cli: relay init --delivery mcp
        description: Add the Relay MCP server for a tool the core cannot inject into, and never both
        location: packages/cli/src/cli/lib/agent-tools-mcp.ts
        verify_tier: 2

      - id: init-skill
        name: Messaging Skill
        description: Install the Agent Relay messaging skill for the connected tools
        location: packages/cli/src/cli/lib/relay-skill.ts
        verify_tier: 2

      - id: init-uninstall
        name: Uninstall
        cli: relay init --uninstall
        description: Remove what relay init added and restore the settings it changed
        location: packages/cli/src/cli/commands/init.ts, packages/cli/src/cli/lib/init-leftovers.ts
        verify_tier: 2

      - id: init-stop
        name: Stop
        cli: relay init --stop
        description: Stop the local server and the core that relay init started
        location: packages/cli/src/cli/commands/init.ts
        verify_tier: 2

      - id: init-desktop-aware
        name: Desktop Awareness
        description: Attach to a running desktop core and never stop or replace it
        location: packages/cli/src/cli/lib/desktop-presence.ts
        verify_tier: 6

  core:
    name: Agent Relay Core
    description: The per-user daemon that finds sessions and carries their messages
    criticality: critical
    features:
      - id: core-install
        name: Pinned Install
        description: Install the core release relay init pins, checked against its checksum
        location: packages/cli/src/cli/lib/relay-node.ts
        verify_tier: 2

      - id: core-serve
        name: Daemon
        description: Run one headless core per user, attached to and never doubled
        location: crates/relay-node/src/relay/daemon.rs, crates/relay-node/src/probe/
        verify_tier: 2

      - id: core-bridge
        name: Bridge
        description: JSON-RPC over a private socket, for the CLI and desktop apps
        location: crates/relay-node/src/relay/server.rs, crates/relay-node/src/relay/protocol.rs, crates/relay-node/src/relay/contract/
        verify_tier: 2

      - id: core-workspace
        name: Workspace Selection
        description: Follow the workspace relay init saved, on a local or hosted server
        location: crates/relay-node/src/relay/workspace.rs, crates/relay-node/src/relay/workspace/
        verify_tier: 2

      - id: core-settings
        name: Settings
        description: Read and change delivery settings for the tools installed on this machine
        location: crates/relay-node/src/relay/settings_registry.rs, crates/relay-node/src/relay/store_settings.rs
        verify_tier: 2

      - id: core-discovery
        name: Session Discovery
        description: Find running sessions of each tool from kernel evidence alone
        location: crates/relay-node/src/relay/sessions.rs, crates/relay-node/src/relay/local/, crates/relay-node/src/relay/process/
        verify_tier: 2

      - id: core-auto-activate
        name: Automatic Joining
        description: Put a discovered session on Relay on its own, outside temporary folders
        location: crates/relay-node/src/relay/agents/
        verify_tier: 2

      - id: core-send-socket
        name: Session Send Socket
        description: Let a session send and list agents, identified by its process
        location: crates/relay-node/src/relay/outbound/, crates/relay-node/src/relay/outbound.rs
        verify_tier: 2

      - id: core-catch-all
        name: Core Runtime
        description: Everything else in the core, so any path here selects the core lane
        location: crates/relay-node/
        verify_tier: 2

  core-delivery:
    name: Delivery Into Sessions
    description: A message on Relay reaches the running session through that tool's own route
    criticality: critical
    features:
      - id: delivery-cursor-cli
        name: Cursor CLI
        description: Hand a message over through Cursor's postToolUse and stop hooks
        location: crates/relay-node/src/relay/cursor_cli/
        verify_tier: 2

      - id: delivery-cursor-editor
        name: Cursor Editor
        description: Wake an idle editor conversation through its waiting stop hook
        location: crates/relay-node/src/relay/cursor_cli/editor.rs, crates/relay-node/src/relay/cursor_cli/wait.rs
        verify_tier: 6

      - id: delivery-grok
        name: Grok
        description: Join a Grok session through its proved leader and prompt it over ACP
        location: crates/relay-node/src/relay/grok.rs, crates/relay-node/src/relay/grok/, crates/relay-node/src/relay/existing_session/, crates/relay-node/src/relay/agents/registration_routes.rs
        verify_tier: 2

      - id: delivery-claude
        name: Claude Code
        description: Put a message in the session's inbox
        location: crates/relay-node/src/relay/claude/, crates/relay-node/src/relay/claude_settings.rs
        verify_tier: 6

      - id: delivery-codex
        name: Codex
        description: Queue a message through Codex's hooks and queue between turns
        location: crates/relay-node/src/relay/codex/, crates/relay-node/src/relay/codex.rs
        verify_tier: 6

      - id: delivery-opencode
        name: OpenCode
        description: Deliver through the Agent Relay plugin
        location: crates/relay-node/src/relay/opencode/, crates/relay-node/src/relay/opencode_existing/
        verify_tier: 6

      - id: delivery-pi
        name: Pi
        description: Deliver through the Agent Relay extension
        location: crates/relay-node/src/relay/pi/, crates/relay-node/src/relay/pi.rs
        verify_tier: 6

      - id: delivery-devin
        name: Devin
        description: Deliver through the lifecycle hooks of a local session
        location: crates/relay-node/src/relay/devin/, crates/relay-node/src/relay/devin.rs
        verify_tier: 6

      - id: delivery-settle
        name: Settling
        description: Acknowledge only what was injected, and retry what was not
        location: crates/relay-node/src/relay/delivery/, crates/relay-node/src/relay/delivery.rs, crates/relay-node/src/relay/inject.rs
        verify_tier: 2

  agent-management:
    name: Agent Management
    description: Register and manage agents in the workspace
    criticality: critical
    features:
      - id: agent-register
        name: Register Agent
        cli: relay agent register <name> [--type <type>] [--persona <persona>]
        description: Register a new agent and print its auth token
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-add
        name: Add Agent
        cli: relay agent add <name> [--type <type>]
        description: Register an additional agent in the workspace
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-list
        name: List Agents
        cli: relay agent list [--status <status>]
        description: Show all agents in the workspace with status
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-me
        name: Show Current Agent Identity
        cli: relay agent me
        description: Show the identity the current agent token resolves to
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-presence
        name: List Agent Presence
        cli: relay agent presence
        description: List visible agent presence in the workspace
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-remove
        name: Remove Agent
        cli: relay agent remove <name>
        description: Remove an agent from the workspace
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-rotate
        name: Rotate Agent Token
        cli: relay agent rotate <name>
        description: Rotate the token for an existing agent name
        location: packages/cli/src/cli/commands/agent.ts
        verify_tier: 3

      - id: agent-capabilities
        name: List Capabilities
        cli: relay capabilities list
        description: Show available agent capabilities
        location: packages/cli/src/cli/commands/capabilities.ts
        verify_tier: 3

      - id: capabilities-register
        name: Register Capability
        cli: relay capabilities register <command> --description <text> --handler <agent>
        description: Register a named capability and the agent that handles it
        location: packages/cli/src/cli/commands/capabilities.ts
        verify_tier: 3

      - id: capabilities-delete
        name: Delete Capability
        cli: relay capabilities delete <command>
        description: Delete a previously registered capability
        location: packages/cli/src/cli/commands/capabilities.ts
        verify_tier: 3

      - id: system-status
        name: Composite System Status
        cli: relay status
        description: Show the current project path and Cloud-login state
        location: packages/cli/src/cli/commands/status.ts
        verify_tier: 1

  messaging-channels:
    name: Channel Messaging
    description: Create and manage channels for agent communication
    criticality: critical
    features:
      - id: channel-create
        name: Create Channel
        cli: relay channel create <name> [--topic <topic>]
        mcp: create_channel
        description: Create a new messaging channel
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: channel-list
        name: List Channels
        cli: relay channel list [--archived]
        mcp: list_channels
        description: Show all channels in the workspace
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: channel-join
        name: Join Channel
        cli: relay channel join <name>
        mcp: join_channel
        description: Join an existing channel as the current agent
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: channel-leave
        name: Leave Channel
        cli: relay channel leave <name>
        mcp: leave_channel
        description: Leave a channel
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: channel-invite
        name: Invite to Channel
        cli: relay channel invite <channel> <agent>
        mcp: invite_to_channel
        description: Invite another agent to a channel
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: channel-set-topic
        name: Set Channel Topic
        cli: relay channel set_topic <channel> <topic>
        mcp: set_channel_topic
        description: Update the topic/description of a channel
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: channel-archive
        name: Archive Channel
        cli: relay channel archive <name>
        mcp: archive_channel
        description: Archive a channel (soft delete, reversible)
        location: packages/cli/src/cli/commands/channel.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

  messaging-messages:
    name: Message Posting & Retrieval
    description: Post, list, and search messages in channels
    criticality: critical
    features:
      - id: message-post
        name: Post Message
        cli: relay message post <channel> <text>
        mcp: post_message
        description: Send a message to a channel as the current agent
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: message-list
        name: List Messages
        cli: relay message list <channel> [--limit <n>]
        mcp: list_messages
        description: Retrieve message history from a channel
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: message-reply
        name: Reply to Message (Threads)
        cli: relay message reply <messageId> <text>
        mcp: reply_to_thread
        description: Reply to a message, creating or extending a thread
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: message-get-thread
        name: Get Thread
        cli: relay message get_thread <messageId>
        mcp: get_message_thread
        description: Retrieve all messages in a thread
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: message-search
        name: Search Messages
        cli: relay message search <query> [--channel <channel>] [--from <agent>] [--limit <n>]
        mcp: search_messages
        description: Search for messages by content across the workspace
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: message-file-upload
        name: Upload File Attachment
        cli: relay message file upload <path> --channel <channel> [--text <text>]
        description: Send a channel message containing a local file attachment
        location: packages/cli/src/cli/commands/message.ts
        verify_tier: 3

      - id: message-file-get
        name: Show File Attachment
        cli: relay message file get <fileId>
        description: Show a stored file, including a short-lived download URL
        location: packages/cli/src/cli/commands/message.ts
        verify_tier: 3

      - id: message-file-download
        name: Download File Attachment
        cli: relay message file download <fileId>
        description: Download a stored file attachment
        location: packages/cli/src/cli/commands/message.ts
        verify_tier: 3

  messaging-dm:
    name: Direct Messages
    description: Private messaging between agents
    criticality: hot
    features:
      - id: dm-send
        name: Send DM
        cli: relay message dm send <agent> <text>
        mcp: send_dm
        description: Send a private direct message to another agent
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/lib/message-delivery-receipts.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: dm-list
        name: List Messages in a DM Conversation
        cli: relay message dm list <conversationId> [--limit <n>]
        description: List the messages in a known direct-message conversation
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: dm-list-conversations
        name: List DM Conversations
        api: GET /v1/dm/conversations
        mcp: list_dms
        description: List direct-message conversations visible to the current MCP identity
        location: packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: dm-send-group
        name: Send Group DM
        cli: relay message dm send_group <text> --to <agents...>
        mcp: send_group_dm
        description: Create a group DM and send the first message to multiple agents
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

  messaging-reactions:
    name: Message Reactions
    description: Emoji reactions on messages
    criticality: standard
    features:
      - id: reaction-add
        name: Add Reaction
        cli: relay message reaction add <messageId> <emoji>
        mcp: add_reaction
        description: Add an emoji reaction to a message
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: reaction-remove
        name: Remove Reaction
        cli: relay message reaction remove <messageId> <emoji>
        mcp: remove_reaction
        description: Remove an emoji reaction from a message
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

  messaging-inbox:
    name: Inbox & Read Status
    description: Track unread messages and mark messages as read
    criticality: hot
    features:
      - id: inbox-check
        name: Check Inbox
        cli: relay message inbox check [--limit <n>]
        mcp: check_inbox
        description: Show unread messages, mentions, and DMs directed to this agent
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: inbox-mark-read
        name: Mark Message Read
        cli: relay message inbox mark_read <messageId>
        mcp: mark_message_read
        description: Mark a message or thread as read for the current agent
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: inbox-get-readers
        name: Get Readers
        cli: relay message inbox get_readers <messageId>
        mcp: get_message_readers
        description: Show which agents have read a specific message
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

  local-workflows:
    name: Local Workflow Execution
    description: Run relayflows v1 workflows on this machine (relayflows resolves its own runtime)
    criticality: hot
    status: legacy
    features:
      - id: local-workflow-run
        name: Run Local Workflow
        cli: relay node workflow run <workflow> [--file-type <type>] [--json]
        description: Run a local YAML, TypeScript, JavaScript, or shell workflow and record its result locally
        location: packages/cli/src/cli/commands/local-workflow.ts
        verify_tier: 1

      - id: local-workflow-logs
        name: Read Local Workflow Logs
        cli: relay node workflow logs <runId> [--follow] [--poll-interval <seconds>] [--offset <bytes>] [--json]
        description: Read or follow the locally recorded output of a workflow run
        location: packages/cli/src/cli/commands/local-workflow.ts
        verify_tier: 1

      - id: local-workflow-sync
        name: Sync Local Workflow Result
        cli: relay node workflow sync <runId> [--dry-run] [--json]
        description: Report the local synchronization state for a completed workflow run
        location: packages/cli/src/cli/commands/local-workflow.ts
        verify_tier: 1

  cloud:
    name: Cloud Features
    description: Cloud account management and remote workflow execution
    criticality: hot
    features:
      - id: cloud-login
        name: Cloud Login
        cli: relay cloud login
        description: Authenticate with Agent Relay Cloud via browser OAuth
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 6

      - id: cloud-logout
        name: Cloud Logout
        cli: relay cloud logout
        description: Clear stored cloud credentials (destructive — skip in automated tests)
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 6

      - id: cloud-whoami
        name: Cloud Whoami
        cli: relay cloud whoami
        description: Show current cloud authentication status (readable if already logged in)
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 5

      - id: cloud-workspaces
        name: List Cloud Workspaces
        cli: relay cloud workspaces
        description: List the Cloud workspaces this login can use, with their IDs
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 5

      - id: cloud-session
        name: Cloud Session
        cli: relay cloud session
        description: Show canonical cloud session details (readable if already logged in)
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 5

      - id: cloud-connect
        name: Connect Provider
        cli: relay cloud connect <provider> [--language <language>] [--timeout <seconds>]
        description: Connect a provider via interactive SSH session
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 6

      - id: cloud-enroll
        name: Enroll Fleet Node
        cli: relay cloud enroll (--token <token> | --workspace <workspaceId>) [--name <name>] [--max-agents <n>] [--json]
        description: Register this machine as a cloud-managed fleet node
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 5

      - id: cloud-run
        name: Submit Cloud Workflow
        cli: relay cloud run <workflow> [--file-type <type>] [--no-sync-code] [--json]
        description: Submit a workflow for remote cloud execution
        location: packages/cli/src/cli/commands/cloud.ts
        verify_tier: 5

