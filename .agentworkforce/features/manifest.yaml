        verify_tier: 4

      - id: dm-list
        name: List DMs
        cli: relay message dm list
        mcp: list_dms
        description: List direct message conversations for the current agent
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

      - id: dm-send-group
        name: Send Group DM
        cli: relay message dm send_group
        mcp: send_group_dm
        description: Create a group DM and send the first message to multiple agents
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 4

  messaging-reactions:
    name: Message Reactions
    description: Emoji reactions on messages
    criticality: standard
    features:
      - id: reaction-add
        name: Add Reaction
        cli: relay message reaction add
        mcp: add_reaction
        description: Add an emoji reaction to a message
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

      - id: reaction-remove
        name: Remove Reaction
        cli: relay message reaction remove
        mcp: remove_reaction
        description: Remove an emoji reaction from a message
        location: packages/cli/src/cli/commands/message.ts, packages/cli/src/cli/mcp/messaging-tools.ts
        verify_tier: 3

  messaging-inbox:
