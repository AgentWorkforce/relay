        verify_tier: 3

      - id: webhook-delete
        name: Delete Webhook
        cli: relay integration webhook delete <id>
        description: Remove a registered webhook
        location: packages/cli/src/cli/commands/integration.ts
        verify_tier: 3

      - id: webhook-trigger
        name: Trigger Webhook
        cli: relay integration webhook trigger
        description: Manually fire a webhook for testing
        location: packages/cli/src/cli/commands/integration.ts
        verify_tier: 3

      - id: webhook-inbound-create
        name: Create Inbound Webhook
        cli: relay integration webhook create-inbound
